<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <title>Registrarse</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <span class="logo-nav">
                <img src="img/LogoMamalon.png" alt="GSD" class="foto-logo-navbar">
            </span>
            <ul class="menu">
                <li><a href="index.html" class="active">Inicio</a></li>
                <li><a href="AboutUs.html">Sobre Nosotros</a></li>
                <li><a href="AditionalInfo.html">Información adicional</a></li>
                <li><a href="Register.html">Registro</a></li>
                <li><a href="Contact.html">Contacto</a></li>
                 <li><a href="Services.html">Servicios</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="register-section">
            <h1 class="titulo-us">Registro</h1>
            <p class="subtitulo-us">Formá parte de Guápiles Sin Desperdicios.</p>

            <form id="register_form">
                <div class="form-group">
                    <label for="id">Número de cédula</label>
                    <input type="number" id="id" required>
                </div>

                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="lastname">Apellidos</label>
                    <input type="text" id="lastname" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="phone_num">Número de teléfono</label>
                    <input type="number" id="phone_num" required>
                </div>

                <div class="form-group">
                    <label for="colaborator_choice">¿Qué tipo de colaborador desea ser?</label>
                    <select name="colaborator_choice" id="colaborator_choice" required>
                        <option value="">Seleccionar</option>
                        <option value="buyer">Comprador</option>
                        <option value="seller">Vendedor</option>
                    </select>
                </div>

                <button type="submit" id="btn_register" class="btn-register">Registrarse</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="anio"></span> Guápiles Sin Desperdicios</p>
        <script src="js/script.js"></script>
    </footer>
</body>

</html>
