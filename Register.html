<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <title>Registrarse</title>
</head>
<body>
    <header>
    </header>

    <main>
      <section id="About_Us" class="About_Us">
            <div class="About_Us-content">
                <img src="img/LogoMamalon.png" alt="Logo de Guapiles sin Desperdicios" class="foto-logo">

                <h1 class="titulo-us">Registro</h1>
                
             

            </div>
        </section>
       <form action="submit" id="register_form">
             <div class="form-group">

                <label for="id">Ingrese su numero de cédula</label>
                <input type="number" id="id" required><br>

                <label for="name">Ingrese su nombre</label>
                <input type="text" id="name" required><br>

                <label for="lastname">Ingrese sus apellidos</label>
                <input type="text" id="lastname" required><br>

                <label for="email">Ingrese su correo electrónico</label>
                <input type="email" id="email" required><br>


                <label for="phone_num">Ingrese su numero de teléfono</label>
                <input type="number" id="phone_num" required><br>

                <label for="colaborator">Seleccione que tipo de colaborador desea ser: </label>
                <select name="colaborator_choice" id="colaborator_choice" required>
                    <option value="">Seleccionar</option>
                    <option value="buyer">Comprador</option>
                    <option value="seller">Vendedor</option>
                </select>
            </div>

            <button type="submit" id="btn_register" class="btn-register">Registrarse</button>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="anio"></span> Guápiles Sin Desperdicios</p>
        <script src="js/script.js"></script>
    </footer>
</body>
</html>
